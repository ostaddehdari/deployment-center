name: Publish Deployment Release

on:
  push:
    branches:
      - 'release/**'
    paths:
      - '.deployment/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Assemble and verify immutable artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          source .deployment/release.env
          if [ "${DIRECT_RELEASE:-0}" = "1" ]; then
            mkdir -p /tmp/release-stage
            cp -a .deployment/overlay/. /tmp/release-stage/
            chmod +x /tmp/release-stage/apply.sh 2>/dev/null || true
            (cd /tmp/release-stage && zip -qr "/tmp/${ASSET_NAME}" .)
          elif [ -n "${BASE_RELEASE_TAG:-}" ]; then
            mkdir -p /tmp/release-stage
            curl --fail --location --retry 3 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${BASE_RELEASE_TAG}/${BASE_ASSET_NAME}" \
              -o /tmp/base-release.zip
            unzip -q /tmp/base-release.zip -d /tmp/release-stage
            if [ -d .deployment/overlay ]; then cp -a .deployment/overlay/. /tmp/release-stage/; fi
            chmod +x /tmp/release-stage/apply.sh 2>/dev/null || true
            (cd /tmp/release-stage && zip -qr "/tmp/${ASSET_NAME}" .)
          else
            cat .deployment/payload.part-* > /tmp/release-payload.b64
            base64 -d /tmp/release-payload.b64 > "/tmp/${ASSET_NAME}"
            if [ -n "${ASSET_SHA256:-}" ]; then
              echo "${ASSET_SHA256}  /tmp/${ASSET_NAME}" | sha256sum -c -
            fi
          fi
          FINAL_ASSET_SHA256="$(sha256sum "/tmp/${ASSET_NAME}" | awk '{print $1}')"
          install -m 0755 .deployment/install.sh /tmp/install.sh
          INSTALL_SHA256="$(sha256sum /tmp/install.sh | awk '{print $1}')"
          printf '%s  %s\n%s  %s\n' \
            "$FINAL_ASSET_SHA256" "$ASSET_NAME" \
            "$INSTALL_SHA256" "install.sh" > /tmp/SHA256SUMS
          if [ -f .deployment/release-manifest.template.json ]; then
            sed \
              -e "s/__ASSET_SHA256__/${FINAL_ASSET_SHA256}/g" \
              -e "s/__INSTALL_SHA256__/${INSTALL_SHA256}/g" \
              .deployment/release-manifest.template.json > /tmp/release-manifest.json
          else
            cp .deployment/release-manifest.json /tmp/release-manifest.json
          fi
          cp .deployment/RELEASE_NOTES.md /tmp/RELEASE_NOTES.md
          echo "FINAL_ASSET_SHA256=$FINAL_ASSET_SHA256" >> "$GITHUB_ENV"
          echo "INSTALL_SHA256=$INSTALL_SHA256" >> "$GITHUB_ENV"

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source .deployment/release.env
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "/tmp/${ASSET_NAME}" /tmp/install.sh /tmp/release-manifest.json /tmp/SHA256SUMS \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "/tmp/${ASSET_NAME}" /tmp/install.sh /tmp/release-manifest.json /tmp/SHA256SUMS \
              --target main \
              --title "${RELEASE_TITLE}" \
              --notes-file /tmp/RELEASE_NOTES.md
          fi

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source .deployment/release.env
          gh release view "${RELEASE_TAG}" --json tagName,assets,url